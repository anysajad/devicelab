<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vertical text overflow (clipped) fixture</title>
    <style>
      body {
        margin: 0;
        font: 16px/20px sans-serif;
      }
      .clipv {
        width: 260px;
        height: 40px;
        overflow: hidden;
        margin: 16px;
        background: #fef9c3;
      }
    </style>
  </head>
  <body>
    <div class="clipv">
      Line of text.
      <br>
      Second line of text.
      <br>
      Third line of text.
      <br>
      Fourth line.
    </div>
  </body>
</html>
