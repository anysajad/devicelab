<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Text overflow (uncertain wrapping) fixture</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font: 16px/20px monospace;
      }
      .uwrap {
        width: 150px;
        height: 20px;
        overflow: visible;
        background: #e0f2fe;
      }
    </style>
  </head>
  <body>
    <div class="uwrap">WWWWWWWWWWWWWWWWWWWWWWWWW</div>
  </body>
</html>
