<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Capture context fixture</title>
    <style>
      /* Deterministic same-origin fixture for screenshot content-boundary
         validation: inline styles only, no external images/fonts/links (an
         untainted canvas and stable pixels). The full-viewport solid backdrop
         lets an E2E test assert that captured pixels are page content (the
         fixture color) rather than workspace chrome (gray/white toolbars,
         bezel, rulers, overlays). */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        font-family: sans-serif;
      }

      .backdrop {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        background: #e74c3c;
      }

      .label {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        margin: 0;
        padding: 12px 20px;
        background: #ffffff;
        color: #111111;
        font-size: 16px;
        font-weight: 700;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="backdrop"></div>
    <p class="label">CAPTURE-CONTEXT-FIXTURE</p>
  </body>
</html>
